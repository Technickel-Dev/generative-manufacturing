<!DOCTYPE html>
<html>

<head>
    <meta name="color-scheme" content="light dark">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0055aa;
            --grid-line-small: rgba(255, 255, 255, 0.15);
            --grid-line-large: rgba(255, 255, 255, 0.4);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --accent-color: #ffffff;
            --card-bg: rgba(0, 85, 170, 0.3);
            --border-color: #ffffff;
            --success-color: #4ade80;
            --warning-color: #facc15;
            --error-color: #f87171;
            --font-tech: 'Rajdhani', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: var(--font-tech);
            color: var(--text-primary);
        }

        body {
            background-color: var(--bg-color);
            background-image:
                linear-gradient(var(--grid-line-large) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-line-large) 2px, transparent 2px),
                linear-gradient(var(--grid-line-small) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line-small) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            background-position: -1px -1px, -1px -1px, 0 0, 0 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 24px;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        /* Technical corner markers */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 10px;
            height: 10px;
            border-top: 4px solid var(--border-color);
            border-left: 4px solid var(--border-color);
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            border-bottom: 4px solid var(--border-color);
            border-right: 4px solid var(--border-color);
        }

        h1,
        h2,
        h3 {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        h3 {
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin: 20px 0 15px 0;
            color: var(--text-secondary);
        }

        .image-container {
            width: 100%;
            border: 2px solid var(--border-color);
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid currentColor;
            background: rgba(0, 0, 0, 0.5);
        }

        .status-badge.ok {
            color: var(--success-color);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
        }

        .status-badge.warning {
            color: var(--warning-color);
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
        }

        .status-badge.failure {
            color: var(--error-color);
            box-shadow: 0 0 15px rgba(248, 113, 113, 0.3);
        }

        .recommendation-alert {
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid var(--border-color);
            font-size: 1.1rem;
        }

        .recommendation-alert.stop {
            background: rgba(248, 113, 113, 0.2);
            color: var(--error-color);
            border-color: var(--error-color);
            animation: pulse 1s infinite;
        }

        .recommendation-alert.pause {
            background: rgba(250, 204, 21, 0.2);
            color: var(--warning-color);
            border-color: var(--warning-color);
        }

        .recommendation-alert.continue {
            background: rgba(74, 222, 128, 0.2);
            color: var(--success-color);
            border-color: var(--success-color);
        }

        .issues-list {
            list-style: none;
            padding: 0;
        }

        .issue-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-left: 6px solid var(--border-color);
            transition: all 0.2s;
        }

        .issue-item:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.05);
        }

        .issue-item.high-confidence {
            border-left-color: var(--error-color);
        }

        .issue-item.med-confidence {
            border-left-color: var(--warning-color);
        }

        .issue-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }

        .issue-type {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
        }

        .issue-conf {
            font-size: 0.85rem;
            opacity: 0.8;
            color: var(--text-secondary);
        }

        .issue-desc {
            opacity: 0.9;
            font-size: 1rem;
            color: var(--text-primary);
            line-height: 1.4;
        }

        /* SOP Styles */
        .sop-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .sop-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .sop-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            transition: background 0.2s;
        }

        .sop-header:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .sop-content {
            padding: 20px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-primary);
            border-top: 1px solid var(--border-color);
        }

        .sop-content.open {
            display: block;
        }

        .sop-content h1,
        .sop-content h2,
        .sop-content h3 {
            border-bottom: none;
            margin: 15px 0 10px 0;
            color: var(--accent-color);
        }

        .sop-content strong {
            color: #fff;
            font-weight: 700;
        }

        /* Controls */
        .controls-area {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .btn {
            border: 2px solid var(--border-color);
            padding: 12px 24px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: var(--font-tech);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .btn:hover {
            background: var(--text-primary);
            color: var(--bg-color);
        }

        .btn-stop {
            border-color: var(--error-color);
            color: var(--error-color);
            background: rgba(248, 113, 113, 0.1);
        }

        .btn-stop:hover {
            background: var(--error-color);
            color: #fff;
        }

        .btn-pause {
            border-color: var(--warning-color);
            color: var(--warning-color);
            background: rgba(250, 204, 21, 0.1);
        }

        .btn-pause:hover {
            background: var(--warning-color);
            color: #000;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px;
            font-size: 1.5rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>
    <div id="loading" class="loading">
        Waiting for incident report...
    </div>

    <div id="dashboard" class="container" style="display: none;">
        <!-- Left Column: Incident Details -->
        <div class="card">
            <h2>🚨 Incident Report</h2>

            <div class="image-container" id="incident-image">
                <!-- Image -->
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <div id="incident-status" class="status-badge"></div>
            </div>

            <div id="incident-recommendation" class="recommendation-alert"></div>

            <div id="controls-section" style="margin-bottom: 20px; display: none;">
                <div class="controls-area"
                    style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; justify-content: center;">
                    <span style="margin-right: auto; font-weight: 500; color: var(--text-secondary);">Machine
                        Control</span>
                    <button class="btn btn-pause">Pause Print</button>
                    <button class="btn btn-stop">Stop Print</button>
                </div>
            </div>

            <h3>Analysis Log</h3>
            <ul id="incident-issues" class="issues-list">
                <!-- Issues -->
            </ul>
        </div>

        <!-- Right Column: SOPs -->
        <div class="card">
            <h2>📋 Standard Operating Procedures</h2>
            <p style="margin-bottom: 15px; font-size: 0.9rem; color: var(--text-secondary);">
                Recommended procedures based on detected failures.
            </p>

            <div id="sop-list" class="sop-container">
                <!-- SOP Items will go here -->
                <div style="text-align: center; padding: 20px; opacity: 0.5;">No specific SOPs found.</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.0/app-with-deps";
        import { marked } from "https://unpkg.com/marked/lib/marked.esm.js";

        const app = new App({ name: "Incident Dashboard", version: "1.0.0" });

        function toggleSop(header) {
            const content = header.nextElementSibling;
            content.classList.toggle('open');
            const icon = header.querySelector('.icon');
            icon.textContent = content.classList.contains('open') ? '▼' : '▶';
        }
        // Expose to window for click handlers if needed, though we'll use addEventListener
        window.toggleSop = toggleSop;

        function renderDashboard(data, imageBase64) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'grid';

            const analysis = data.analysis;
            const sops = data.sops || [];

            // 1. Image
            if (imageBase64) {
                let imgSrc = imageBase64;
                if (!imageBase64.startsWith('http')) {
                    imgSrc = `data:image/jpeg;base64,${imageBase64}`;
                }
                document.getElementById('incident-image').innerHTML =
                    `<img src="${imgSrc}" alt="Incident Snapshot">`;
            }

            // 2. Incident Details
            if (analysis) {
                const statusBadge = document.getElementById('incident-status');
                statusBadge.textContent = analysis.status.toUpperCase();
                statusBadge.className = `status-badge ${analysis.status}`;

                const recAlert = document.getElementById('incident-recommendation');
                recAlert.innerHTML = `Recommended Action: <strong>${analysis.recommendation.toUpperCase()}</strong>`;
                recAlert.className = `recommendation-alert ${analysis.recommendation}`;

                // Show controls if action is needed
                if (analysis.recommendation !== 'continue') {
                    document.getElementById('controls-section').style.display = 'block';
                } else {
                    document.getElementById('controls-section').style.display = 'none';
                }

                const issuesList = document.getElementById('incident-issues');
                issuesList.innerHTML = '';
                if (analysis.issues && analysis.issues.length) {
                    analysis.issues.forEach(issue => {
                        const li = document.createElement('li');
                        const confClass = issue.confidence > 0.8 ? 'high-confidence' : (issue.confidence > 0.5 ? 'med-confidence' : '');
                        li.className = `issue-item ${confClass}`;
                        li.innerHTML = `
                            <div class="issue-header">
                                <span class="issue-type">${issue.type}</span>
                                <span class="issue-conf">${Math.round(issue.confidence * 100)}%</span>
                            </div>
                            <div class="issue-desc">${issue.description}</div>
                        `;
                        issuesList.appendChild(li);
                    });
                } else {
                    issuesList.innerHTML = '<li class="issue-item">No specific issues detected.</li>';
                }
            }

            // 3. SOPs
            const sopList = document.getElementById('sop-list');
            sopList.innerHTML = '';

            if (sops.length > 0) {
                sops.forEach(sop => {
                    const div = document.createElement('div');
                    div.className = 'sop-item';

                    // Convert markdown to HTML
                    const htmlContent = marked.parse(sop.content);

                    div.innerHTML = `
                        <div class="sop-header">
                            <span>${sop.title}</span>
                            <span class="icon">▶</span>
                        </div>
                        <div class="sop-content">
                            ${htmlContent}
                        </div>
                    `;

                    div.querySelector('.sop-header').addEventListener('click', function () {
                        toggleSop(this);
                    });

                    sopList.appendChild(div);
                });

                // Open the first one by default
                if (sopList.firstElementChild) {
                    toggleSop(sopList.firstElementChild.querySelector('.sop-header'));
                }
            } else {
                sopList.innerHTML = '<div style="text-align: center; padding: 20px; opacity: 0.5;">No relevant SOPs found for this incident.</div>';
            }

            // Bind button events
            const pauseBtn = document.querySelector('.btn-pause');
            const stopBtn = document.querySelector('.btn-stop');

            if (pauseBtn) {
                pauseBtn.onclick = async () => {
                    pauseBtn.disabled = true;
                    pauseBtn.textContent = 'Pausing...';
                    try {
                        // Use callServerTool instead of callTool
                        const result = await app.callServerTool({ name: 'pause_printer', arguments: {} });
                        console.log('Pause result:', result);
                        pauseBtn.textContent = 'Paused';
                        pauseBtn.style.color = '#fff';
                    } catch (err) {
                        console.error('Failed to pause:', err);
                        pauseBtn.textContent = 'Pause Failed (See Console)';
                        pauseBtn.style.color = '#ef4444';
                        pauseBtn.disabled = false;
                        // Alert is blocked in sandbox, so we use console/UI
                    }
                };
            }

            if (stopBtn) {
                stopBtn.onclick = async () => {
                    // Confirm dialogs might also be blocked in sandbox depending on attributes
                    // If confirm is blocked, we might need a custom modal.
                    // For now, let's try confirm, if it fails/ignored, specific logic needed.
                    // But error said "Ignored call to 'alert()'". 'confirm()' likely ignored too.
                    // Let's make it a double-click or just immediate for now to unblock, 
                    // or assume the user knows what they are doing.
                    // BETTER: Change text to "Click again to confirm"

                    if (stopBtn.textContent !== 'Confirm Stop?') {
                        stopBtn.textContent = 'Confirm Stop?';
                        stopBtn.style.backgroundColor = '#b91c1c'; // Darker red
                        setTimeout(() => {
                            if (stopBtn.textContent === 'Confirm Stop?') {
                                stopBtn.textContent = 'Stop Print';
                                stopBtn.style.backgroundColor = '';
                            }
                        }, 3000);
                        return;
                    }

                    stopBtn.disabled = true;
                    stopBtn.textContent = 'Stopping...';
                    try {
                        const result = await app.callServerTool({ name: 'stop_printer', arguments: {} });
                        console.log('Stop result:', result);
                        stopBtn.textContent = 'Stopped';
                    } catch (err) {
                        console.error('Failed to stop:', err);
                        stopBtn.textContent = 'Stop Failed (See Console)';
                        stopBtn.style.color = '#ef4444';
                        stopBtn.disabled = false;
                    }
                };
            }
        }

        app.ontoolresult = ({ content }) => {
            try {
                const textPart = content.find(c => c.type === 'text');
                const imagePart = content.find(c => c.type === 'image');

                if (textPart) {
                    let jsonText = textPart.text.trim();
                    if (jsonText.startsWith('```json')) {
                        jsonText = jsonText.replace(/^```json/, '').replace(/```$/, '');
                    } else if (jsonText.startsWith('```')) {
                        jsonText = jsonText.replace(/^```/, '').replace(/```$/, '');
                    }

                    const data = JSON.parse(jsonText);
                    // Use image from arguments (preferred) or from data if embedded (fallback)
                    const img = (imagePart && imagePart.data) ? imagePart.data : (data.image || null);

                    renderDashboard(data, img);
                }
            } catch (e) {
                console.error(e);
                document.getElementById('dashboard').innerHTML = `<div class="card full-width" style="color: #ef4444; text-align: center;">Error loading dashboard: ${e.message}</div>`;
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        };

        app.connect();

        app.onhostcontextchanged = (ctx) => {
            if (ctx.safeAreaInsets) {
                document.body.style.paddingTop = `${ctx.safeAreaInsets.top}px`;
                document.body.style.paddingBottom = `${ctx.safeAreaInsets.bottom}px`;
            }
        };
    </script>
</body>

</html>
