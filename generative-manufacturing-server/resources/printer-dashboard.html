<!DOCTYPE html>
<html>

<head>
  <meta name="color-scheme" content="light dark">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0055aa;
      --grid-line-small: rgba(255, 255, 255, 0.15);
      --grid-line-large: rgba(255, 255, 255, 0.4);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.8);
      --accent-color: #ffffff;
      --card-bg: rgba(0, 85, 170, 0.3);
      --border-color: #ffffff;
      --success-color: #4ade80;
      --warning-color: #facc15;
      --error-color: #f87171;
      --font-tech: 'Rajdhani', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-family: var(--font-tech);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    body {
      background-color: var(--bg-color);
      background-image:
        linear-gradient(var(--grid-line-large) 2px, transparent 2px),
        linear-gradient(90deg, var(--grid-line-large) 2px, transparent 2px),
        linear-gradient(var(--grid-line-small) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line-small) 1px, transparent 1px);
      background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
      background-position: -1px -1px, -1px -1px, 0 0, 0 0;
      padding: 10px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 15px;
      animation: fadeInDown 0.6s ease-out;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      border-bottom: 2px solid var(--border-color);
      display: inline-block;
      padding-bottom: 10px;
    }

    .header .subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 8px currentColor;
    }

    .status-indicator.idle {
      background: var(--success-color);
      color: var(--success-color);
    }

    .status-indicator.printing {
      background: var(--warning-color);
      color: var(--warning-color);
      animation: pulse 1s infinite;
    }

    .status-indicator.error {
      background: var(--error-color);
      color: var(--error-color);
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 15px;
      align-items: start;
      animation: fadeInUp 0.6s ease-out 0.2s both;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      padding: 20px;
      position: relative;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
    }

    /* Technical corner markers */
    .card::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      width: 10px;
      height: 10px;
      border-top: 4px solid var(--border-color);
      border-left: 4px solid var(--border-color);
    }

    .card::after {
      content: '';
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 10px;
      height: 10px;
      border-bottom: 4px solid var(--border-color);
      border-right: 4px solid var(--border-color);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-color);
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .card-content {
      font-size: 1.125rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9rem;
    }

    .info-value {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .temp-display {
      text-align: center;
      margin: 16px 0;
    }

    .temp-value {
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .temp-target {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      overflow: hidden;
      margin: 12px 0;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--text-primary);
      transition: width 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Striped pattern for technical look */
      background-image: linear-gradient(45deg,
          rgba(0, 0, 0, 0.1) 25%,
          transparent 25%,
          transparent 50%,
          rgba(0, 0, 0, 0.1) 50%,
          rgba(0, 0, 0, 0.1) 75%,
          transparent 75%,
          transparent);
      background-size: 10px 10px;
    }



    .error-message {
      background: rgba(248, 113, 113, 0.2);
      border: 1px solid var(--error-color);
      padding: 20px;
      margin-top: 20px;
      text-align: center;
      color: #fca5a5;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid var(--border-color);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }

      .dashboard {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🖨️ Printer Dashboard</h1>
      <p class="subtitle">Real-time monitoring of your Prusa printer</p>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Connecting to printer...</p>
    </div>

    <div id="dashboard" class="dashboard" style="display: none;"></div>
    <div id="error" class="error-message" style="display: none;"></div>
  </div>

  <script type="module">
    import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.0/app-with-deps";
    // Progress bar styles and logic are now inline


    const app = new App({ name: "Printer Dashboard", version: "1.0.0" });
    let refreshInterval;

    function formatTime(seconds) {
      if (!seconds || seconds === 0) return "N/A";
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      return hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
    }

    function getStateClass(state) {
      const stateStr = String(state).toLowerCase();
      if (stateStr.includes('print')) return 'printing';
      if (stateStr.includes('error') || stateStr.includes('fault')) return 'error';
      return 'idle';
    }

    function renderDashboard(data) {
      const loading = document.getElementById('loading');
      const dashboard = document.getElementById('dashboard');
      const errorDiv = document.getElementById('error');

      loading.style.display = 'none';
      errorDiv.style.display = 'none';
      dashboard.style.display = 'grid';

      const stateClass = getStateClass(data.state);

      dashboard.innerHTML = `
        <div class="card">
          <div class="card-title">Printer Information</div>
          <div class="card-content">
            <div class="info-row">
              <span class="info-label">Name</span>
              <span class="info-value">${data.name || 'N/A'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Model</span>
              <span class="info-value">${data.model || 'N/A'}</span>
            </div>

            <div class="info-row">
              <span class="info-label">Firmware</span>
              <span class="info-value">${data.firmware || 'N/A'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Status</span>
              <span class="info-value">
                <span class="status-indicator ${stateClass}"></span>
                ${data.state || 'Unknown'}
              </span>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Temperatures</div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
            <div>
              <div class="info-label" style="text-align: center; margin-bottom: 8px;">Nozzle</div>
              <div class="temp-display" style="margin: 0;">
                <div class="temp-value" style="font-size: 2.5rem;">${data.temp_nozzle || 0}°C</div>
                <div class="temp-target">Target: ${data.target_nozzle || 0}°C</div>
              </div>
              <div class="progress-bar" style="margin-top: 12px; height: 12px;">
                <div class="progress-fill" style="width: ${Math.min(100, (data.temp_nozzle / Math.max(data.target_nozzle, 1)) * 100)}%"></div>
              </div>
            </div>
            <div>
              <div class="info-label" style="text-align: center; margin-bottom: 8px;">Bed</div>
              <div class="temp-display" style="margin: 0;">
                <div class="temp-value" style="font-size: 2.5rem;">${data.temp_bed || 0}°C</div>
                <div class="temp-target">Target: ${data.target_bed || 0}°C</div>
              </div>
              <div class="progress-bar" style="margin-top: 12px; height: 12px;">
                <div class="progress-fill" style="width: ${Math.min(100, (data.temp_bed / Math.max(data.target_bed, 1)) * 100)}%"></div>
              </div>
            </div>
            <div>
              <div class="info-label" style="text-align: center; margin-bottom: 8px;">Chamber</div>
              <div class="temp-display" style="margin: 0;">
                <div class="temp-value" style="font-size: 2.5rem;">${data.temp_chamber ? data.temp_chamber + '°C' : 'N/A'}</div>
                <div class="temp-target">Target: ${data.target_chamber || 0}°C</div>
              </div>
              <div class="progress-bar" style="margin-top: 12px; height: 12px;">
                <div class="progress-fill" style="width: ${Math.min(100, (data.temp_chamber / Math.max(data.target_chamber, 1)) * 100)}%"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Print Progress</div>
          <div class="card-content">
            <div style="text-align: center; margin-bottom: 10px;">
                <div class="temp-value" style="font-size: 3.5rem;">${data.progress || 0}%</div>
            </div>
            <div class="progress-bar" style="height: 16px; margin-bottom: 24px;">
              <div class="progress-fill" style="width: ${data.progress || 0}%"></div>
            </div>
            <div class="info-row">
              <span class="info-label">Time Remaining</span>
              <span class="info-value">${formatTime(data.time_remaining)}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Print Time</span>
              <span class="info-value">${formatTime(data.print_time)}</span>
            </div>
          </div>
        </div>
      `;
    }

    function showError(message) {
      const loading = document.getElementById('loading');
      const dashboard = document.getElementById('dashboard');
      const errorDiv = document.getElementById('error');

      loading.style.display = 'none';
      dashboard.style.display = 'none';
      errorDiv.style.display = 'block';
      errorDiv.textContent = message;
    }

    async function fetchPrinterData(content) {
      try {
        if (content && content.length > 0) {
          const textContent = content.find(c => c.type === 'text');
          if (textContent) {
            try {
              const data = JSON.parse(textContent.text);
              if (data.error) {
                showError(data.error);
                return;
              }

              renderDashboard(data);
            } catch (e) {
              console.error("Failed to parse printer data:", e);
              showError("Failed to parse printer data");
            }
          }
        }
      } catch (error) {
        console.error("Error fetching printer data:", error);
        showError(`Error: ${error.message}`);
      }
    }

    app.ontoolresult = ({ content }) => {
      fetchPrinterData(content);
    };

    function handleHostContextChanged(ctx) {
      if (ctx.safeAreaInsets) {
        document.body.style.paddingTop = `${ctx.safeAreaInsets.top}px`;
        document.body.style.paddingRight = `${ctx.safeAreaInsets.right}px`;
        document.body.style.paddingBottom = `${ctx.safeAreaInsets.bottom}px`;
        document.body.style.paddingLeft = `${ctx.safeAreaInsets.left}px`;
      }
    }

    app.onhostcontextchanged = handleHostContextChanged;

    await app.connect();
    const ctx = app.getHostContext();
    if (ctx) {
      handleHostContextChanged(ctx);
    }

    // Refresh every 3 seconds
    // refreshInterval = setInterval(fetchPrinterData, 3000);
  </script>
</body>

</html>
