<!DOCTYPE html>
<html>

<head>
    <meta name="color-scheme" content="light dark">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0055aa;
            --grid-line-small: rgba(255, 255, 255, 0.15);
            --grid-line-large: rgba(255, 255, 255, 0.4);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --accent-color: #ffffff;
            --card-bg: rgba(0, 85, 170, 0.3);
            --border-color: #ffffff;
            --success-color: #4ade80;
            --error-color: #f87171;
            --font-tech: 'Rajdhani', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: var(--font-tech);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                linear-gradient(var(--grid-line-large) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-line-large) 2px, transparent 2px),
                linear-gradient(var(--grid-line-small) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line-small) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            background-position: -1px -1px, -1px -1px, 0 0, 0 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 40px;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        /* Technical corner markers */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 10px;
            height: 10px;
            border-top: 4px solid var(--border-color);
            border-left: 4px solid var(--border-color);
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            border-bottom: 4px solid var(--border-color);
            border-right: 4px solid var(--border-color);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: var(--font-tech);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            font-family: var(--font-tech);
            font-weight: 700;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: var(--text-primary);
            color: var(--bg-color);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .image-preview {
            margin-top: 30px;
            min-height: 200px;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .image-preview img {
            max-width: 100%;
            display: block;
            border: 1px solid var(--border-color);
        }

        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--border-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }

        .error-message {
            background: rgba(248, 113, 113, 0.2);
            border: 1px solid var(--error-color);
            color: #fca5a5;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: none;
        }

        .scale-label {
            position: absolute;
            bottom: -25px;
            right: 0;
            font-size: 0.8rem;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>💠 3D Model Generator</h1>

            <div id="loading" class="loading-overlay">
                <div class="spinner"></div>
                <div class="status-text">Drafting with Gemini & OpenSCAD...</div>
                <div style="font-size: 0.9rem; opacity: 0.8; margin-top: 8px;">(This usually takes about 20-30 seconds)
                </div>
            </div>

            <div id="error" class="error-message"></div>

            <div id="result" class="result-area" style="display: none;">
                <div class="image-preview" id="previewContainer"></div>
                <div class="info-box">
                    <p id="successMessage"
                        style="color: #34d399; font-weight: 700; margin-bottom: 0; font-size: 1.1rem;">✓ Generation
                        Complete</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.0/app-with-deps";
        const app = new App({ name: "Model Generator", version: "1.0.0" });

        const loading = document.getElementById('loading');
        const resultArea = document.getElementById('result');
        const previewContainer = document.getElementById('previewContainer');
        const errorDiv = document.getElementById('error');

        app.ontoolresult = ({ content }) => {
            try {
                loading.style.display = 'none';

                if (!content || content.length === 0) {
                    throw new Error("No content received from tool.");
                }

                const imagePart = content.find(c => c.type === 'image');
                const textPart = content.find(c => c.type === 'text');

                if (imagePart) {
                    previewContainer.innerHTML = `<img src="data:${imagePart.mimeType};base64,${imagePart.data}" alt="Preview">`;
                    resultArea.style.display = 'block';
                } else if (textPart) {
                    const text = textPart.text.trim();
                    // Check if it's a URL
                    if (text.startsWith('http')) {
                        previewContainer.innerHTML = `<img src="${text}" alt="Preview">`;
                        resultArea.style.display = 'block';
                    }
                    // Check for error messages in text
                    else if (text.toLowerCase().includes("failed") || text.toLowerCase().includes("error")) {
                        throw new Error(text);
                    } else {
                        // Text only success (fallback)
                        previewContainer.innerHTML = `<div style="padding: 40px; text-align: center;">No preview image available.</div>`;
                        resultArea.style.display = 'block';
                    }
                } else {
                    throw new Error("Unknown content format.");
                }

            } catch (err) {
                console.error(err);
                loading.style.display = 'none';
                errorDiv.textContent = err.message || "Unknown error occurred";
                errorDiv.style.display = 'block';
            }
        };

        // Handle safe area insets if needed (consistent with other apps)
        app.onhostcontextchanged = (ctx) => {
            if (ctx.safeAreaInsets) {
                document.body.style.paddingTop = `${ctx.safeAreaInsets.top}px`;
                document.body.style.paddingBottom = `${ctx.safeAreaInsets.bottom}px`;
            }
        };

        await app.connect();
    </script>
</body>

</html>
