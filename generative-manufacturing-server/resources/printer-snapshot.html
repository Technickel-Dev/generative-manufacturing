<!DOCTYPE html>
<html>

<head>
    <meta name="color-scheme" content="light dark">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0055aa;
            --grid-line-small: rgba(255, 255, 255, 0.15);
            --grid-line-large: rgba(255, 255, 255, 0.4);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --accent-color: #ffffff;
            --card-bg: rgba(0, 85, 170, 0.3);
            --border-color: #ffffff;
            --success-color: #4ade80;
            --error-color: #f87171;
            --font-tech: 'Rajdhani', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: var(--font-tech);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                linear-gradient(var(--grid-line-large) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-line-large) 2px, transparent 2px),
                linear-gradient(var(--grid-line-small) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line-small) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            background-position: -1px -1px, -1px -1px, 0 0, 0 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 40px;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Technical corner markers */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 10px;
            height: 10px;
            border-top: 4px solid var(--border-color);
            border-left: 4px solid var(--border-color);
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            border-bottom: 4px solid var(--border-color);
            border-right: 4px solid var(--border-color);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            width: 100%;
        }

        p {
            color: var(--text-secondary);
            font-family: var(--font-tech);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 1rem;
        }

        .image-container {
            width: 100%;
            border: 2px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            border: 1px solid var(--border-color);
        }

        .loading {
            color: var(--accent-color);
            font-family: var(--font-tech);
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }

        .error {
            background: rgba(248, 113, 113, 0.2);
            border: 1px solid var(--error-color);
            color: #fca5a5;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            padding: 12px 30px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-tech);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.1rem;
        }

        button:hover {
            background: var(--text-primary);
            color: var(--bg-color);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div>
                <h1>📸 Printer Snapshot</h1>
                <p style="opacity: 0.8; font-size: 0.9rem">Latest view from the printer camera</p>
            </div>

            <div id="image-container" class="image-container">
                <div class="loading">Waiting for image...</div>
            </div>

            <button id="refresh-btn" onclick="requestSnapshot()" style="display: none;">Refresh Snapshot</button>

            <div id="error-msg" class="error" style="display: none;"></div>
        </div>
    </div>

    <script type="module">
        import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.0/app-with-deps";

        const app = new App({ name: "Printer Snapshot", version: "1.0.0" });
        const imgContainer = document.getElementById('image-container');
        const errorMsg = document.getElementById('error-msg');
        const refreshBtn = document.getElementById('refresh-btn');

        async function processResult(content) {
            try {
                if (!content || content.length === 0) return;

                const imgContent = content.find(c => c.type === 'image');
                if (imgContent) {
                    displayImage(imgContent.data, imgContent.mimeType);
                } else {
                    const textContent = content.find(c => c.type === 'text');
                    if (textContent) {
                        const text = textContent.text.trim();
                        // Check if it's a URL
                        if (text.startsWith('http')) {
                            displayImage(text, 'url');
                        }
                        // Check if it's an error message
                        else if (text.toLowerCase().includes('error') || text.toLowerCase().includes('fail')) {
                            showError(text);
                        } else {
                            showError("No image data found in response.");
                        }
                    }
                }
            } catch (e) {
                showError("Error processing result: " + e.message);
            }
        }

        window.requestSnapshot = async function () {
            refreshBtn.disabled = true;
            refreshBtn.textContent = "Loading...";
            errorMsg.style.display = 'none';

            try {
                const result = await app.callServerTool({ name: "get_camera_frame", arguments: {} });
                if (result && result.content) {
                    processResult(result.content);
                } else if (result && Array.isArray(result)) {
                    // Some potential variance in result structure
                    processResult(result);
                }
            } catch (e) {
                console.error(e);
                showError("Failed to refresh: " + e.message);
            }
        }

        function displayImage(data, mimeType) {
            let src = '';
            if (mimeType === 'url') {
                src = data;
            } else {
                src = `data:${mimeType};base64,${data}`;
            }
            imgContainer.innerHTML = `<img src="${src}" alt="Printer Snapshot" />`;
            refreshBtn.disabled = false;
            refreshBtn.textContent = "Refresh Snapshot";
            refreshBtn.style.display = 'inline-block';
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            imgContainer.innerHTML = '<div class="loading">Failed to load image</div>';
            refreshBtn.disabled = false;
            refreshBtn.textContent = "Refresh Snapshot";
            // Make sure button is visible so user can try again
            refreshBtn.style.display = 'inline-block';
        }

        app.ontoolresult = ({ content }) => {
            processResult(content);
        };

        // Handle styling for hosts
        app.onhostcontextchanged = (ctx) => {
            if (ctx.safeAreaInsets) {
                document.body.style.paddingTop = `${ctx.safeAreaInsets.top}px`;
                document.body.style.paddingBottom = `${ctx.safeAreaInsets.bottom}px`;
            }
        };

        await app.connect();
    </script>
</body>

</html>
