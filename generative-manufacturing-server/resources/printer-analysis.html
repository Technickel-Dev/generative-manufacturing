<!DOCTYPE html>
<html>

<head>
    <meta name="color-scheme" content="light dark">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0055aa;
            --grid-line-small: rgba(255, 255, 255, 0.15);
            --grid-line-large: rgba(255, 255, 255, 0.4);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --accent-color: #ffffff;
            --card-bg: rgba(0, 85, 170, 0.3);
            --border-color: #ffffff;
            --success-color: #4ade80;
            --warning-color: #facc15;
            --error-color: #f87171;
            --font-tech: 'Rajdhani', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: var(--font-tech);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                linear-gradient(var(--grid-line-large) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-line-large) 2px, transparent 2px),
                linear-gradient(var(--grid-line-small) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line-small) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            background-position: -1px -1px, -1px -1px, 0 0, 0 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 30px;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        /* Technical corner markers */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 10px;
            height: 10px;
            border-top: 4px solid var(--border-color);
            border-left: 4px solid var(--border-color);
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            border-bottom: 4px solid var(--border-color);
            border-right: 4px solid var(--border-color);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 700;
            text-align: center;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .image-container {
            width: 100%;
            border: 2px solid var(--border-color);
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid var(--border-color);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid currentColor;
            background: rgba(0, 0, 0, 0.5);
        }

        .status-badge.ok {
            color: var(--success-color);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
        }

        .status-badge.warning {
            color: var(--warning-color);
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
        }

        .status-badge.failure {
            color: var(--error-color);
            box-shadow: 0 0 15px rgba(248, 113, 113, 0.3);
        }

        .recommendation-alert {
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid var(--border-color);
            font-size: 1.1rem;
        }

        .recommendation-alert.stop {
            background: rgba(248, 113, 113, 0.2);
            color: var(--error-color);
            border-color: var(--error-color);
            animation: pulse 1s infinite;
        }

        .recommendation-alert.pause {
            background: rgba(250, 204, 21, 0.2);
            color: var(--warning-color);
            border-color: var(--warning-color);
        }

        .recommendation-alert.continue {
            background: rgba(74, 222, 128, 0.2);
            color: var(--success-color);
            border-color: var(--success-color);
        }

        .issues-list {
            list-style: none;
            padding: 0;
        }

        .issue-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-left: 6px solid var(--border-color);
            transition: all 0.2s;
        }

        .issue-item:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.05);
        }

        .issue-item.high-confidence {
            border-left-color: var(--error-color);
        }

        .issue-item.med-confidence {
            border-left-color: var(--warning-color);
        }

        .issue-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }

        .issue-type {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
        }

        .issue-conf {
            font-size: 0.85rem;
            opacity: 0.8;
            color: var(--text-secondary);
        }

        .issue-desc {
            opacity: 0.9;
            font-size: 1rem;
            color: var(--text-primary);
            line-height: 1.4;
        }

        h3 {
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--border-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        .error-message {
            background: rgba(248, 113, 113, 0.2);
            border: 1px solid var(--error-color);
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            color: #fca5a5;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>🔍 Print Failure Analysis</h1>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Analyzing printer snapshot with Gemini 3...</p>
            </div>

            <div id="content" style="display: none;">
                <div class="image-container" id="snapshot-container">
                    <!-- Image will be injected here -->
                </div>

                <div style="text-align: center;">
                    <div id="status-badge" class="status-badge"></div>
                </div>

                <div id="recommendation" class="recommendation-alert"></div>

                <div id="issues-container">
                    <h3>Detected Issues</h3>
                    <ul id="issues-list" class="issues-list"></ul>
                </div>
            </div>

            <div id="error" class="error-message"
                style="display: none; padding: 20px; background: rgba(255,0,0,0.2); border-radius: 8px; text-align: center;">
            </div>
        </div>
    </div>

    <script type="module">
        import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.0/app-with-deps";

        const app = new App({ name: "Analysis Result", version: "1.0.0" });

        function renderAnalysis(analysis, imageData) {
            if (!analysis) return;

            // Handle error response from server
            if (analysis.error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = analysis.error;
                return;
            }

            const contentDiv = document.getElementById('content');
            const loadingDiv = document.getElementById('loading');

            loadingDiv.style.display = 'none';
            contentDiv.style.display = 'block';

            // 1. Render Image
            const imgUrl = imageData || analysis.image_url;
            if (imgUrl) {
                const imgContainer = document.getElementById('snapshot-container');
                let src = imgUrl;
                if (!imgUrl.startsWith('http')) {
                    src = `data:image/jpeg;base64,${imgUrl}`;
                }
                // Create image element programmatically to handle onload
                const img = new Image();
                img.src = src;
                img.alt = "Printer Snapshot";
                img.onload = () => {
                    // Notify host that image is loaded
                    app.sendMessage({
                        role: "assistant",
                        content: [{ type: "text", text: "Printer snapshot loaded in UI." }]
                    }).catch(err => console.error("Failed to send notification:", err));
                };

                imgContainer.innerHTML = '';
                imgContainer.appendChild(img);
            }

            // 2. Render Status (Check if status exists)
            if (analysis.status) {
                const statusBadge = document.getElementById('status-badge');
                statusBadge.textContent = analysis.status.toUpperCase();
                statusBadge.className = `status-badge ${analysis.status}`;
            } else {
                console.warn("Analysis response missing 'status' field:", analysis);
            }

            // 3. Render Recommendation
            const recAlert = document.getElementById('recommendation');
            if (analysis.recommendation) {
                recAlert.textContent = analysis.recommendation;
                recAlert.className = `recommendation-alert ${analysis.recommendation}`;

                if (analysis.recommendation === 'stop') {
                    recAlert.innerHTML = `⚠️ RECOMMENDATION: <strong>STOP PRINTER</strong>`;
                } else if (analysis.recommendation === 'pause') {
                    recAlert.innerHTML = `✋ RECOMMENDATION: <strong>PAUSE PRINTER</strong>`;
                } else {
                    recAlert.innerHTML = `✅ RECOMMENDATION: <strong>CONTINUE</strong>`;
                }
            } else {
                recAlert.innerHTML = `<span>Analysis Incomplete</span>`;
                recAlert.className = `recommendation-alert`;
            }

            // 4. Render Issues
            const issuesContainer = document.getElementById('issues-container');
            const issuesList = document.getElementById('issues-list');
            issuesList.innerHTML = '';

            if (analysis.issues && analysis.issues.length > 0) {
                issuesContainer.style.display = 'block';
                analysis.issues.forEach(issue => {
                    const li = document.createElement('li');
                    const confClass = issue.confidence > 0.8 ? 'high-confidence' : (issue.confidence > 0.5 ? 'med-confidence' : '');
                    li.className = `issue-item ${confClass}`;

                    li.innerHTML = `
            <div class="issue-header">
              <span class="issue-type">${issue.type}</span>
              <span class="issue-conf">${(issue.confidence * 100).toFixed(0)}% confidence</span>
            </div>
            <div class="issue-desc">${issue.description}</div>
          `;
                    issuesList.appendChild(li);
                });
            } else {
                issuesContainer.style.display = 'none';
            }
        }

        app.ontoolresult = ({ content }) => {
            // content is array of TextContent or ImageContent
            try {
                const textPart = content.find(c => c.type === 'text');
                const imagePart = content.find(c => c.type === 'image');

                if (textPart) {
                    // The analysis JSON might be wrapped in Markdown code blocks or plain text
                    let jsonText = textPart.text.trim();
                    // Strip markdown blocks if present
                    if (jsonText.startsWith('```json')) {
                        jsonText = jsonText.replace(/^```json/, '').replace(/```$/, '');
                    } else if (jsonText.startsWith('```')) {
                        jsonText = jsonText.replace(/^```/, '').replace(/```$/, '');
                    }

                    // Should be an array or object
                    const analysis = JSON.parse(jsonText);
                    // If array (from user's previous verification output), take first item
                    const data = Array.isArray(analysis) ? analysis[0] : analysis;

                    renderAnalysis(data, imagePart ? imagePart.data : null);
                } else if (imagePart && !textPart) {
                    // Just image?
                    const imgContainer = document.getElementById('snapshot-container');
                    const loadingDiv = document.getElementById('loading');
                    loadingDiv.style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                    imgContainer.innerHTML = `<img src="data:image/jpeg;base64,${imagePart.data}" alt="Printer Snapshot" />`;
                    document.getElementById('issues-list').innerHTML = `<li>Error: No analysis text received.</li>`;
                }
            } catch (e) {
                console.error(e);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = "Failed to display results: " + e.message;
            }
        };

        app.connect();

        // Handle context changes for safe areas
        app.onhostcontextchanged = (ctx) => {
            if (ctx.safeAreaInsets) {
                document.body.style.paddingTop = `${ctx.safeAreaInsets.top}px`;
                document.body.style.paddingBottom = `${ctx.safeAreaInsets.bottom}px`;
            }
        };
    </script>
</body>

</html>
